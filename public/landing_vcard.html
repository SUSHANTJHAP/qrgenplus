<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/js/api_config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Card</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9129456058305887" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center border border-slate-700">
    <div class="w-20 h-20 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
      {{INITIALS}}
    </div>
    <h1 class="text-2xl font-bold mb-1">{{NAME}}</h1>
    <p class="text-indigo-400 font-medium mb-6">{{ORG}}</p>

    <div class="space-y-3 text-left mb-8">
      <div class="bg-slate-900 rounded-2xl p-4 flex items-center gap-4 border border-slate-700">
        <div class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path></svg>
        </div>
        <div class="overflow-hidden">
          <p class="text-xs text-slate-500 font-semibold mb-0.5">Phone</p>
          <a href="tel:{{PHONE}}" class="text-sm font-medium text-white truncate block">{{PHONE}}</a>
        </div>
      </div>

      <div class="bg-slate-900 rounded-2xl p-4 flex items-center gap-4 border border-slate-700">
        <div class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </div>
        <div class="overflow-hidden">
          <p class="text-xs text-slate-500 font-semibold mb-0.5">Email</p>
          <a href="mailto:{{EMAIL}}" class="text-sm font-medium text-white truncate block">{{EMAIL}}</a>
        </div>
      </div>
    </div>

    <button onclick="downloadVCard()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-full py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition flex items-center justify-center gap-2">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      Save Contact
    </button>
  </div>

  <script>
    function downloadVCard() {
      const vcardData = `{{VCARD_DATA}}`.replace(/\\n/g, '\n');
      const blob = new Blob([vcardData], { type: 'text/vcard' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'contact.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      window.URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
