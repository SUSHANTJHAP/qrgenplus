<!DOCTYPE html>
<html lang="en">
<head>
  <script src="assets/js/api_config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Connection Details</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  <style>
    body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9129456058305887" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl text-center border border-slate-700">
    <div class="w-16 h-16 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto mb-6">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"></path></svg>
    </div>
    <h1 class="text-2xl font-bold mb-2">WiFi Network</h1>
    <p class="text-slate-400 mb-8">Connect to this network</p>

    <div class="text-left bg-slate-900 rounded-2xl p-5 mb-6 border border-slate-700">
      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Network Name (SSID)</label>
      <div class="text-lg font-medium text-white mb-4">{{WIFI_SSID}}</div>

      <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Password</label>
      <div class="flex items-center justify-between gap-3">
        <div class="text-lg font-medium text-white break-all" id="wifi-pass">{{WIFI_PASS}}</div>
        <button onclick="copyPass()" class="text-indigo-400 hover:text-indigo-300 p-2 bg-indigo-500/10 rounded-lg transition" aria-label="Copy password">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
        </button>
      </div>
    </div>

    <p id="copy-msg" class="text-sm text-green-400 h-5 mb-4 opacity-0 transition-opacity">Password copied!</p>
  </div>

  <script>
    function copyPass() {
      const pass = document.getElementById('wifi-pass').innerText;
      navigator.clipboard.writeText(pass).then(() => {
        const msg = document.getElementById('copy-msg');
        msg.style.opacity = '1';
        setTimeout(() => msg.style.opacity = '0', 2000);
      });
    }
  </script>
</body>
</html>
